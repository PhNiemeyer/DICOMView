name: Publish site package (for VPS)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-site
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Pack site + Caddyfile
        run: |
          mkdir -p pkg && cp -r dist pkg/site && cp deploy/Caddyfile pkg/Caddyfile
          tar -czf dicomview-site.tar.gz -C pkg .
      - name: Update release "site-latest" in place (no download gap)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view site-latest >/dev/null 2>&1 || gh release create site-latest --title "Site package (latest main)" --notes "Used by deploy/docker-compose.yml." --latest=false
          gh release upload site-latest dicomview-site.tar.gz --clobber
          gh release edit site-latest --notes "Built from ${GITHUB_SHA}. Used by deploy/docker-compose.yml."
